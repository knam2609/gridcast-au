[project]
name = "gridcast-au"
version = "0.1.0"
description = "Australian electricity (NEM) demand & price forecasting and market-intelligence platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "alembic>=1.13",
    "holidays>=0.60",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pandera>=0.24",
    "psycopg[binary]>=3.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "structlog>=24.4",
    "tabulate>=0.9",
    "tenacity>=9.0",
    "typer>=0.12",
    "tzdata>=2024.1",
]

[project.scripts]
gridcast = "gridcast.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridcast"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PD", "NPY", "RUF", "DTZ", "PTH"]
ignore = [
    "RUF001", # allow unicode (e.g. "−", "×") in strings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["gridcast"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: requires the docker-compose PostgreSQL service (run with `make test-integration`)",
]
filterwarnings = ["error::FutureWarning", "error::pandas.errors.Pandas4Warning"]
